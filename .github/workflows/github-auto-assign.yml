name: Auto-assign issue
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, ready_for_review]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: 'auto-assign issue'
        uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c # v4.1.0
        with:
          repo-token: ${{ secrets.PAT_GITHUB }}
          teams: devops-ia
